<h2>User Data</h2>
<ul>

    @for (user of userData(); track user.id) {
        <div class="edits">
            <ul>
                <li>Id: {{user.id}}</li>
                <li>Name: {{user.name}}</li>
                <li>Age: {{user.age}}</li>
                <li>email: {{user.email}}</li>
            </ul>
            <div>
                <button (click)="deleteuser(user.id)">Delete</button>
                <button (click)="edituser(user.id)">Edit</button>

            </div>
        </div>   
    }
</ul>
